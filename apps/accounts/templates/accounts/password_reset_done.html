{% extends "base.html" %}
{% block title %}ایمیل ارسال شد | {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-20 text-center">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-primary mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
    </svg>
    <h1 class="text-2xl font-bold font-display text-ink mb-3">ایمیل ارسال شد</h1>
    <p class="text-ink/60 leading-7">
        اگر ایمیل وارد‌شده در سیستم ثبت شده باشد، لینک بازنشانی رمز عبور برایتان ارسال شد.
        لطفاً صندوق ورودی (و پوشه اسپم) را بررسی کنید.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn-primary inline-block mt-6">بازگشت به ورود</a>
</section>
{% endblock %}
