{% extends "base.html" %}
{% block title %}تغییر رمز عبور | {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-14">
    <div class="bg-white rounded-xl border border-line p-8">
        <h1 class="text-2xl font-bold font-display text-ink mb-8 text-center">تغییر رمز عبور</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm text-ink/70 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-red-600 text-xs mt-1">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn-primary w-full">به‌روزرسانی رمز عبور</button>
        </form>
    </div>
</section>
{% endblock %}
