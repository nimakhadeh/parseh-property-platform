{% load property_extras %}
{% if properties %}
{% with element_id=map_id|default:'property-map' %}
<div id="{{ element_id }}" data-property-map class="w-full h-80 rounded-xl border border-line z-0" style="direction: ltr;"></div>
{% with data_id=element_id|add:'-data' %}{{ properties|map_points|json_script:data_id }}{% endwith %}
<script>
(function() {
    var dataEl = document.currentScript.previousElementSibling;
    var mapEl = dataEl.previousElementSibling;
    if (!mapEl || mapEl.dataset.initialized) return;
    mapEl.dataset.initialized = "true";
    var points = JSON.parse(dataEl.textContent);
    var map;

    function initializeMap() {
        // Leaflet باید اندازهٔ واقعی ظرف را ببیند؛ نقشهٔ لیست ابتدا مخفی است.
        if (!points.length || !mapEl.offsetWidth || !mapEl.offsetHeight) return;
        if (map) {
            map.invalidateSize();
            return;
        }

        map = L.map(mapEl, { scrollWheelZoom: false }).setView([points[0].lat, points[0].lng], points.length > 1 ? 12 : 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        var markerGroup = L.featureGroup();
        points.forEach(function(p) {
            var popup = document.createElement('div');
            popup.style.cssText = 'direction:rtl;font-family:Vazirmatn,sans-serif;text-align:right;';
            var title = document.createElement('strong');
            title.textContent = p.title;
            var price = document.createElement('span');
            price.style.cssText = 'color:#2F5D50;font-weight:bold;';
            price.textContent = p.price;
            var link = document.createElement('a');
            link.href = p.url;
            link.style.color = '#2F5D50';
            link.textContent = 'مشاهده جزئیات ←';
            popup.append(title, document.createElement('br'), price, document.createElement('br'), link);

            var marker = L.marker([p.lat, p.lng]).bindPopup(popup);
            marker.addTo(map);
            markerGroup.addLayer(marker);
        });

        if (points.length > 1) {
            map.fitBounds(markerGroup.getBounds().pad(0.2));
        }
    }

    mapEl.addEventListener('parseh:map-shown', initializeMap);
    initializeMap();
})();
</script>
{% endwith %}
{% endif %}
