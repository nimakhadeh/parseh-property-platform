# تنظیمات Nginx برای پلتفرم املاک پارسه
# این فایل را در /etc/nginx/sites-available/parseh قرار داده و لینک سیمبولیک بسازید:
# sudo ln -s /etc/nginx/sites-available/parseh /etc/nginx/sites-enabled/

upstream parseh_app {
    server unix:/opt/parseh_project/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name example.com www.example.com;  # دامنه خود را جایگزین کنید

    client_max_body_size 20M;

    access_log /var/log/nginx/parseh-access.log;
    error_log  /var/log/nginx/parseh-error.log;

    location /static/ {
        alias /opt/parseh_project/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/parseh_project/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://parseh_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ------------------------------------------------------------------
    # تنظیمات SSL (پس از اجرای certbot به‌صورت خودکار این بخش تکمیل می‌شود)
    # مثال دستی:
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # ------------------------------------------------------------------
}

# پس از فعال‌سازی SSL با Certbot، بلوک زیر به صورت خودکار اضافه می‌شود
# تا درخواست‌های HTTP به HTTPS ریدایرکت شوند:
